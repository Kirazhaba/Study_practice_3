<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Доска публикаций</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="container2">
            <h1>Доска публикаций</h1>
            <button id="loadBtn" class="btn primary-btn">Посмотреть список публикаций</button>
        </div>
        
        
        <div id="loadingMessage" class="message loading hidden">Загрузка...</div>
        <div id="errorMessage" class="message error hidden"></div>
        <div id="successMessage" class="message success hidden"></div>

        <div id="publicationsList" class="publications-list"></div>

        <form id="createForm" class="create-form">
            <h2>Создать новую публикацию</h2>
            <div class="form-group">
                <label for="title">Заголовок</label>
                <input type="text" id="title" name="title">
            </div>
            <div class="form-group">
                <label for="body">Текст</label>
                <textarea id="body" name="body" rows="4"></textarea>
            </div>
            <button type="submit" id="createBtn" class="btn secondary-btn">Создать публикацию</button>
        </form>
    </div>

    <script src="app.js"></script>
</body>
</html>
